    <!-- Responsive Design -->

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>


        /* ========================= */
        /*-------- Background ------ */
        /* ========================= */

        body{

            background:
            linear-gradient(
                135deg,
                #d9dbe4,
                #d1d9df
            );

            overflow-x: hidden;
        }



        /* ========================= */
        /*    Hero Text Animation    */
        /* ========================= */


        .moving-text{

            font-size: 70px;

            font-weight: bold;

            font-family: Helvetica, sans-serif;

            animation:
            floatText 3s ease-in-out infinite;

        }

        @keyframes floatText{

            0%{
                transform: translateY(0px);
            }

            50%{
                transform: translateY(-15px);
            }

            100%{
                transform: translateY(0px);
            }

        }


        /* Modal Design */

        .modal-content{

            border-radius: 25px;

            border: none;

            backdrop-filter: blur(10px);

            box-shadow:
             10px 40px rgba(0,0,0,0.2);

        }



        /* ========================= */
        /*    ADD Note Animation    */
        /* ========================= */

        .btn.btn-primary.btn-lg:hover{
            background: #2e88ff;

            color: midnightblue;

            transform:
                translateY(-3px);

            box-shadow:
                1px 12px 25px rgba(0,0,0,0.25);

        }



        /* ========================= */
        /*    ADD Note style    */
        /* ========================= */


        .btn.btn-primary.btn-lg{

        background: #e4e4e4;

        color: blue;

        border: none;

        border-radius: 50px;

        padding:
            14px 32px;

        font-size: 1.2rem;

        font-weight: 600;

        transition:
            all 0.3s ease;

        box-shadow:
            0px 5px 20px rgba(0,0,0,0.15);
        }




        /* ========================= */
        /* CHAT BUTTON */
        /* ========================= */



        .chat-btn{

            position: fixed;

            bottom: 30px;

            right: 30px;

            z-index: 1001;

            border: none;

            background: transparent;

        }

        .chat-btn img{

            border-radius: 50%;

            box-shadow:
                0px 5px 25px rgba(0,0,0,0.3);

            transition: 0.5s ease;

        }

        .chat-btn img:hover{

            transform: scale(1.08);

        }


        /* ========================= */
        /* CHAT PANEL */
        /* ========================= */


        .chat-panel{

            position: fixed;

            right: 30px;

            bottom: 110px;

            width: 370px;

            height: 600px;

            background: white;

            border-radius: 25px;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            z-index: 1000;

            box-shadow:
                1px 10px 40px rgba(0,0,0,0.25);

            opacity: 0;

            pointer-events: none;

            transform:
                translateY(40px)
                scale(0.95);

            transition:
                all 0.35s ease;

        }


        /* ACTIVE PANEL */

        .chat-panel.active{

            opacity: 1;

            pointer-events: auto;

            transform:
                translateY(0px)
                scale(1);

        }


        /* ========================= */
        /* HEADER */
        /* ========================= */


        .chat-header{

            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #3d8bfd
                );

            padding: 15px 20px;

            color: white;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }

        .chat-header img{

            border-radius: 50%;

        }



        /* ========================= */
        /* CHAT BODY */
        /* ========================= */



        .chat-body{

            flex: 1;

            overflow-y: auto;

            padding: 20px;

            background: #f8f9fa;

        }



        /* ========================= */
        /* MESSAGE */
        /* ========================= */



        .message{

            max-width: 75%;

            padding: 12px 15px;

            border-radius: 18px;

            margin-bottom: 15px;

            animation:
                messagePop 0.3s ease;

        }



        /* BOT */


        .bot-message{

            background: white;

            color: black;

            border-bottom-left-radius: 5px;

            box-shadow:
                1px 2px 10px rgba(0,0,0,0.08);

        }


        /* USER */

        .user-message{

            margin-left: auto;

            background: #0d6efd;

            color: white;

            border-bottom-right-radius: 5px;

        }


        /* ========================= */
        /* INPUT AREA */
        /* ========================= */

        .chat-input-area{

            display: flex;

            gap: 12px;

            padding: 15px;

            border-top: 3px solid #ddd;

            background: white;

        }

        .chat-input-area input{

            flex: 1;

            border: none;

            background: #f1f3f5;

            padding: 5px;

            border-radius: 20px;

            outline: none;

        }

        .chat-input-area button{

            border: none;

            width: 48px;

            height: 48px;

            border-radius: 50%;

            background: #2545ca;

            color: white;

            font-size: 20px;

        }


        /* ========================= */
        /* MESSAGE ANIMATION */
        /* ========================= */

        @keyframes messagePop{

            from{

                opacity: 0;

                transform:
                    translateY(10px);

            }

            to{

                opacity: 1;

                transform:
                    translateY(0px);

            }

        }
        .notbuk{
            position: absolute;
            Bottom: 5px;
            /*right: 5px;*/
            background: white;
            display:inline-flex;
            align-items: center;
            justify-content: center;
            


        }
    </style>

</head>

<! -- |||||||||=======-----iChatBot-----========|||||||||| -->


<script>

const chatForm =
document.getElementById("chatForm");

const chatInput =
document.getElementById("chatInput");

const chatBody =
document.getElementById("chatBody");


chatForm.addEventListener("submit", async (e) => {

    e.preventDefault();

    const userMessage =
    chatInput.value.trim();

    if(!userMessage) return;


    /* USER MESSAGE */

    chatBody.innerHTML += `

        <div class="message user-message">

            ${userMessage}

        </div>
`;


    /* CLEAR INPUT */

    chatInput.value = "";


    /* SEND TO FASTAPI */

    const response = await fetch("/ichat", {

        method: "POST",

        headers: {

            "Content-Type":
            "application/x-www-form-urlencoded"

        },

        body:
        new URLSearchParams({

            chat: userMessage

        })

    });


    const data =
    await response.json();


    /* BOT MESSAGE */

    chatBody.innerHTML += `

        <div class="message bot-message">

            ${data.reply}

        </div>

    `;


    /* AUTO SCROLL */

    chatBody.scrollTop =
    chatBody.scrollHeight;

});

</script>



<! -- |||||||||=======-----iChat-Panel Toggling-----========|||||||||| -->

</script>
